name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Everything is offline Demo Mode: no model is called and no secret is needed.
    name: tests + evaluation (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: constraints.txt
      - name: Install (pinned)
        run: python -m pip install -e ".[dev]" -c constraints.txt
      - name: Unit, integration and end-to-end tests on the real LangGraph graph
        run: python -m pytest -v
      - name: Evaluation gates and scorer self-test
        run: python -m exception_agents eval --self-test
      - name: A negative control must fail the gates (exit 4)
        shell: bash
        run: |
          set +e
          python -m exception_agents eval --control critic_and_validator_off
          code=$?
          echo "exit code $code"
          test "$code" -eq 4
      - name: Committed cases and demo data equal a fresh run
        shell: bash
        run: |
          set -e
          python -m exception_agents generate --check
          python -m exception_agents demo --check
